<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AA2000 · Site Survey Platform</title>
    <meta name="description" content="AA2000 Site Survey &amp; Estimation Platform — Premium enterprise security system survey and cost estimation tool for field technicians, sales teams, and administrators." />
    <meta name="theme-color" content="#2563EB" />

    <!-- Google Fonts: Inter + Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Manrope:wght@400;500;600;700;800;900&family=Outfit:wght@100..900&display=swap" rel="stylesheet" />
    <!-- CDN Fonts: Lemon Milk + Google Sans -->
    <link rel="preconnect" href="https://fonts.cdnfonts.com" />
    <link href="https://fonts.cdnfonts.com/css/lemon-milk" rel="stylesheet" />
    <link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet" />

    <style>
      @import "tailwindcss";

      /* ─── Reset & Box Model ─── */
      *, *::before, *::after { box-sizing: border-box; }

      /* ═══════════════════════════════════════════════
         DESIGN TOKENS
      ═══════════════════════════════════════════════ */
      :root {
        /* 8-point Spacing Scale */
        --space-1:  4px;
        --space-2:  8px;
        --space-3:  12px;
        --space-4:  16px;
        --space-5:  20px;
        --space-6:  24px;
        --space-7:  28px;
        --space-8:  32px;
        --space-10: 40px;
        --space-12: 48px;
        --space-16: 64px;

        /* Elevation Shadows */
        --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
        --shadow-sm: 0 1px 4px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
        --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.05);
        --shadow-lg: 0 8px 24px rgba(0,0,0,0.10), 0 2px 6px rgba(0,0,0,0.05);
        --shadow-xl: 0 16px 40px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.06);

        /* Border Radius Scale */
        --radius-sm:  6px;
        --radius-md:  10px;
        --radius-lg:  16px;
        --radius-xl:  20px;
        --radius-2xl: 24px;
        --radius-full: 9999px;

        /* Semantic Color Tokens — muted, WCAG-AA compliant */
        --color-success:       #16A34A;
        --color-success-light: #DCFCE7;
        --color-success-muted: rgba(22,163,74,0.10);

        --color-warning:       #CA8A04;
        --color-warning-light: #FEF9C3;
        --color-warning-muted: rgba(202,138,4,0.10);

        --color-error:         #DC2626;
        --color-error-light:   #FEE2E2;
        --color-error-muted:   rgba(220,38,38,0.10);

        --color-info:          #2563EB;
        --color-info-light:    #DBEAFE;
        --color-info-muted:    rgba(37,99,235,0.10);

        --color-neutral:       #64748B;
        --color-neutral-light: #F1F5F9;
        --color-neutral-muted: rgba(100,116,139,0.10);

        /* Text tokens */
        --text-primary:   #0F172A;
        --text-secondary: #475569;
        --text-tertiary:  #94A3B8;
        --text-disabled:  #CBD5E1;

        /* Surface tokens */
        --surface-base:       #F8FAFC;
        --surface-raised:     #FFFFFF;
        --surface-overlay:    rgba(15,23,42,0.48);
        --surface-border:     #E2E8F0;
        --surface-border-soft:#F1F5F9;

        /* Role variables — updated by JS via data-role */
        --role-primary:      #2563EB;
        --role-primary-dark: #1D4ED8;
        --role-primary-light:#3B82F6;
        --role-accent:       #38BDF8;
        --role-alpha-08:     rgba(37,99,235,0.08);
        --role-alpha-12:     rgba(37,99,235,0.12);
        --role-alpha-20:     rgba(37,99,235,0.20);
        --role-alpha-30:     rgba(37,99,235,0.30);

        /* Transition speeds */
        --transition-fast: 100ms;
        --transition-base: 200ms;
        --transition-slow: 350ms;
        --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-spring:   cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      /* ─── Base Body ─── */
      body {
        background-color: var(--surface-base);
        min-height: 100vh;
        margin: 0;
        font-family: 'Inter', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        color: var(--text-primary);
        font-size: 14px;
        line-height: 1.5;
      }

      /* ─── Scrollbar ─── */
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* ─── Number inputs ─── */
      input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

      /* ─── Focus ring — accessible & on-brand ─── */
      :focus-visible {
        outline: 2px solid var(--role-primary, #2563EB);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
      }

      /* ═══════════════════════════════════════════════
         ANIMATIONS
      ═══════════════════════════════════════════════ */

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up { animation: fadeInUp 0.38s var(--ease-out-expo) both; }

      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      .animate-fade-in { animation: fadeIn 0.25s ease both; }

      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.95) translateY(-4px); }
        to   { opacity: 1; transform: scale(1)    translateY(0); }
      }
      .animate-scale-in { animation: scaleIn 0.22s var(--ease-out-expo) both; }

      @keyframes slideInLeft {
        from { opacity: 0; transform: translateX(-18px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      .animate-slide-in-left { animation: slideInLeft 0.3s var(--ease-out-expo) both; }

      @keyframes slideDown {
        from { opacity: 0; transform: translateY(-8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-slide-down { animation: slideDown 0.2s var(--ease-out-expo) both; }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-slide-up { animation: slideUp 0.25s var(--ease-out-expo) both; }

      @keyframes toastIn {
        from { opacity: 0; transform: translateX(20px) scale(0.95); }
        to   { opacity: 1; transform: translateX(0)   scale(1); }
      }
      .animate-toast-in { animation: toastIn 0.3s var(--ease-out-expo) both; }

      /* Skeleton shimmer */
      @keyframes shimmer {
        0%   { background-position: -800px 0; }
        100% { background-position:  800px 0; }
      }
      .skeleton {
        background: linear-gradient(90deg, #F1F5F9 25%, #E8EDF5 50%, #F1F5F9 75%);
        background-size: 800px 100%;
        animation: shimmer 1.6s ease-in-out infinite;
        border-radius: var(--radius-md);
      }
      .skeleton-soft {
        background: linear-gradient(90deg, #EEF2F8 25%, #E2E8F2 50%, #EEF2F8 75%);
        background-size: 800px 100%;
        animation: shimmer 1.6s ease-in-out infinite;
        border-radius: var(--radius-md);
      }

      @keyframes floatA {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50%      { transform: translateY(-10px) rotate(2deg); }
      }
      @keyframes floatB {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50%      { transform: translateY(8px) rotate(-3deg); }
      }
      .animate-float-a { animation: floatA 7s ease-in-out infinite; }
      .animate-float-b { animation: floatB 9s ease-in-out infinite; }

      @keyframes pulseGlow {
        0%, 100% { box-shadow: 0 0 0 0   rgba(37,99,235,0.25); }
        50%      { box-shadow: 0 0 0 6px rgba(37,99,235,0); }
      }
      .pulse-glow { animation: pulseGlow 2.2s ease-in-out infinite; }

      @keyframes countUp {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-count { animation: countUp 0.5s var(--ease-out-expo) both; }

      @keyframes progressFill { from { width: 0%; } }
      .progress-animate { animation: progressFill 0.9s var(--ease-out-expo) both; }

      @keyframes spin { to { transform: rotate(360deg); } }
      .animate-spin { animation: spin 0.75s linear infinite; }

      @keyframes ping {
        75%, 100% { transform: scale(2); opacity: 0; }
      }
      .animate-ping { animation: ping 1.2s cubic-bezier(0,0,0.2,1) infinite; }

      @keyframes aiBounce {
        0%, 100% { transform: translateY(0); }
        50%       { transform: translateY(-4px); }
      }
      .animate-ai-bounce { animation: aiBounce 1.2s ease-in-out infinite; }

      /* Stagger delays */
      .delay-50  { animation-delay: 50ms; }
      .delay-75  { animation-delay: 75ms; }
      .delay-100 { animation-delay: 100ms; }
      .delay-150 { animation-delay: 150ms; }
      .delay-200 { animation-delay: 200ms; }
      .delay-225 { animation-delay: 225ms; }
      .delay-250 { animation-delay: 250ms; }
      .delay-300 { animation-delay: 300ms; }
      .delay-350 { animation-delay: 350ms; }
      .delay-375 { animation-delay: 375ms; }
      .delay-400 { animation-delay: 400ms; }
      .delay-450 { animation-delay: 450ms; }

      /* ═══════════════════════════════════════════════
         GLASSMORPHISM
      ═══════════════════════════════════════════════ */
      .glass {
        background: rgba(255,255,255,0.76);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255,255,255,0.55);
      }
      .glass-dark {
        background: rgba(15,23,42,0.72);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.08);
      }

      /* ═══════════════════════════════════════════════
         INTERACTIVE UTILITIES
      ═══════════════════════════════════════════════ */
      .hover-lift {
        transition:
          transform var(--transition-base) var(--ease-out-expo),
          box-shadow var(--transition-base) var(--ease-out-expo);
      }
      .hover-lift:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }

      .hover-lift-sm {
        transition:
          transform var(--transition-base) var(--ease-out-expo),
          box-shadow var(--transition-base) ease;
      }
      .hover-lift-sm:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      }

      .btn-press {
        transition: transform var(--transition-fast) ease;
        position: relative;
        overflow: hidden;
      }
      .btn-press:active { transform: scale(0.97); }

      .interactive {
        transition:
          background-color var(--transition-base) ease,
          border-color var(--transition-base) ease,
          color var(--transition-base) ease,
          box-shadow var(--transition-base) ease;
      }

      /* ═══════════════════════════════════════════════
         CARD STYLES
      ═══════════════════════════════════════════════ */
      .card {
        background: var(--surface-raised);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-sm);
        transition:
          box-shadow var(--transition-base) ease,
          border-color var(--transition-base) ease;
      }
      .card:hover {
        box-shadow: var(--shadow-md);
        border-color: #CBD5E1;
      }
      .card-accent-left {
        border-left: 3px solid var(--role-primary, #2563EB);
      }
      /* Gradient card border */
      .card-gradient-border {
        position: relative;
        border-radius: var(--radius-xl);
        background: white;
      }
      .card-gradient-border::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: calc(var(--radius-xl) + 1px);
        background: linear-gradient(135deg, rgba(37,99,235,0.25), transparent 60%);
        z-index: -1;
      }

      /* ═══════════════════════════════════════════════
         SIDEBAR
      ═══════════════════════════════════════════════ */
      .sidebar-nav-item {
        transition:
          background var(--transition-fast) ease,
          color var(--transition-fast) ease,
          transform var(--transition-base) var(--ease-out-expo);
        border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
      }
      .sidebar-nav-item:hover { transform: translateX(2px); }

      /* ═══════════════════════════════════════════════
         STATUS BADGE
      ═══════════════════════════════════════════════ */
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        display: inline-block;
        flex-shrink: 0;
      }

      /* ═══════════════════════════════════════════════
         PROGRESS BAR
      ═══════════════════════════════════════════════ */
      .progress-bar-track {
        background: var(--surface-border-soft);
        border-radius: var(--radius-full);
        overflow: hidden;
        height: 6px;
      }
      .progress-bar-fill {
        height: 100%;
        border-radius: var(--radius-full);
        transition: width 0.9s var(--ease-out-expo);
        background: var(--role-primary, #2563EB);
      }

      /* ═══════════════════════════════════════════════
         MODAL BACKDROP
      ═══════════════════════════════════════════════ */
      .modal-backdrop {
        background: var(--surface-overlay);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }

      /* ═══════════════════════════════════════════════
         SEARCH INPUT
      ═══════════════════════════════════════════════ */
      .search-input {
        transition:
          box-shadow var(--transition-base) ease,
          border-color var(--transition-base) ease,
          background-color var(--transition-base) ease;
      }
      .search-input:focus {
        box-shadow: 0 0 0 3px var(--role-alpha-12, rgba(37,99,235,0.12));
        border-color: var(--role-primary, #2563EB) !important;
        background-color: #fff !important;
      }

      /* ═══════════════════════════════════════════════
         FORM INPUTS — Consistent 40px height
      ═══════════════════════════════════════════════ */
      .form-input {
        height: 40px;
        padding: 0 14px;
        border-radius: var(--radius-lg);
        border: 1px solid var(--surface-border);
        background: var(--surface-raised);
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 500;
        outline: none;
        transition:
          border-color var(--transition-base) ease,
          box-shadow var(--transition-base) ease;
        width: 100%;
      }
      .form-input:focus {
        border-color: var(--role-primary, #2563EB);
        box-shadow: 0 0 0 3px var(--role-alpha-12, rgba(37,99,235,0.12));
      }
      .form-input::placeholder { color: var(--text-tertiary); }

      /* ═══════════════════════════════════════════════
         TYPOGRAPHY UTILITIES
      ═══════════════════════════════════════════════ */
      .text-page-title {
        font-size: 18px;
        font-weight: 800;
        color: var(--text-primary);
        letter-spacing: -0.025em;
        font-family: 'Manrope', 'Inter', sans-serif;
        line-height: 1.2;
      }
      .text-section-title {
        font-size: 11px;
        font-weight: 700;
        color: var(--text-tertiary);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .text-label {
        font-size: 10px;
        font-weight: 700;
        color: var(--text-tertiary);
        text-transform: uppercase;
        letter-spacing: 0.07em;
      }

      /* ═══════════════════════════════════════════════
         BADGE / CHIP VARIANTS
      ═══════════════════════════════════════════════ */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        border-radius: var(--radius-full);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        line-height: 1.6;
        transition: opacity var(--transition-fast) ease;
      }
      .badge-success { color: var(--color-success); background: var(--color-success-muted); }
      .badge-warning { color: var(--color-warning); background: var(--color-warning-muted); }
      .badge-error   { color: var(--color-error);   background: var(--color-error-muted); }
      .badge-info    { color: var(--color-info);     background: var(--color-info-muted); }
      .badge-neutral { color: var(--color-neutral);  background: var(--color-neutral-muted); }

      /* ═══════════════════════════════════════════════
         EMPTY STATE
      ═══════════════════════════════════════════════ */
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: var(--space-16) var(--space-8);
        gap: var(--space-4);
        text-align: center;
      }
      .empty-state-icon {
        width: 72px;
        height: 72px;
        border-radius: var(--radius-2xl);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
      }

      /* ═══════════════════════════════════════════════
         TABLE ROWS
      ═══════════════════════════════════════════════ */
      .table-row {
        min-height: 48px;
        transition:
          background-color var(--transition-fast) ease,
          border-color var(--transition-fast) ease;
      }
      .table-row:hover { background-color: #F8FAFC; }

      /* ═══════════════════════════════════════════════
         TOOLTIP
      ═══════════════════════════════════════════════ */
      [data-tooltip] { position: relative; }
      [data-tooltip]::after {
        content: attr(data-tooltip);
        position: absolute;
        bottom: calc(100% + 6px);
        left: 50%;
        transform: translateX(-50%) scale(0.9);
        background: #0F172A;
        color: #F8FAFC;
        font-size: 11px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: var(--radius-md);
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition:
          opacity var(--transition-fast) ease,
          transform var(--transition-fast) ease;
        z-index: 100;
      }
      [data-tooltip]:hover::after {
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }

      /* ─── Divider ─── */
      .divider {
        border: none;
        border-top: 1px solid var(--surface-border-soft);
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Auto-select number inputs
      document.addEventListener('focus', function(e) {
        if (e.target.tagName === 'INPUT' && e.target.type === 'number') {
          e.target.select();
        }
      }, true);
    </script>
  </body>
</html>
